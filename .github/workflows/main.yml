name: Naomix Kernel Compiler
on:
  workflow_dispatch:

jobs:
  build:
    # Menggunakan Ubuntu 20.04 karena lebih stabil untuk kernel 4.14
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt install -y curl wget git build-essential zip bc libssl-dev bison flex libelf-dev libgnutls28-dev python2 python3
          mkdir -p $GITHUB_WORKSPACE/work

      - name: Download Toolchains
        run: |
          cd $GITHUB_WORKSPACE/work
          git clone https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b -b lineage-20.0 clang --depth=1
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 -b lineage-19.1 gcc64 --depth=1
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 -b lineage-19.1 gcc32 --depth=1

      - name: Clone Source
        run: |
          cd $GITHUB_WORKSPACE/work
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} -b ${{ github.ref_name }} android-kernel --depth=1

      - name: Build Kernel
        run: |
          cd $GITHUB_WORKSPACE/work/android-kernel
          
          # Setup Toolchain Path
          export PATH=$GITHUB_WORKSPACE/work/gcc64/bin:$GITHUB_WORKSPACE/work/gcc32/bin:$GITHUB_WORKSPACE/work/clang/bin:$PATH
          
          # Nama defconfig sesuai repo kamu
          export KCONFIG=merlin_defconfig
          
          make O=out ARCH=arm64 clean
          make O=out ARCH=arm64 mrproper
          make O=out ARCH=arm64 $KCONFIG
          
          # Mulai Kompilasi
          make -j$(nproc --all) O=out \
              ARCH=arm64 \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-android- \
              CROSS_COMPILE_ARM32=arm-linux-androideabi- \
              HOSTCC=gcc \
              HOSTCXX=g++ \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              STRIP=llvm-strip

      - name: Package AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE/work
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          
          # Mencari file Image
          IMAGE=$(find android-kernel/out/arch/arm64/boot -name "Image.gz*" -type f | head -n 1)
          
          if [ -f "$IMAGE" ]; then
            cp "$IMAGE" AnyKernel3/
            cd AnyKernel3
            sed -i 's/device.name1=maguro/device.name1=merlin/g' anykernel.sh
            zip -r9 "../Naomix-Kernel-Final.zip" *
          else
            echo "Build gagal, Image tidak ditemukan!"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naomix-Kernel-Final
          path: work/Naomix-Kernel-Final.zip

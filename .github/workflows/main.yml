- name: Build Kernel
        run: |
          cd $GITHUB_WORKSPACE/work/android-kernel
          # ... (step setup tetap sama)
          
          make O=out ARCH=arm64 merlin_defconfig
          
          # --- PERBAIKAN V12 (SLEEP & WAKEUP FIX) ---
          
          # 1. Identitas Nama
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-NaomixBang+"/g' out/.config
          
          # 2. Fix Power Management (Biar nggak mati pas dikunci)
          echo "CONFIG_SUSPEND=y" >> out/.config
          echo "CONFIG_PM_SLEEP=y" >> out/.config
          echo "CONFIG_PM_AUTOSLEEP=y" >> out/.config
          echo "CONFIG_PM_WAKELOCKS=y" >> out/.config
          
          # 3. Jinakkan Watchdog (Penyebab utama restart saat Deep Sleep)
          # Kita buat Watchdog lebih sabar menanti driver yang lambat bangun
          echo "CONFIG_MTK_WD_KICKER=y" >> out/.config
          echo "CONFIG_MTK_WATCHDOG_REBOOT_LEVEL=0" >> out/.config
          echo "CONFIG_LOCKUP_DETECTOR=n" >> out/.config
          echo "CONFIG_DETECT_HUNG_TASK=n" >> out/.config
          
          # 4. Fix Backlight & Display (Berdasarkan log TI_LMU)
          echo "CONFIG_LEDS_TI_LMU_COMMON=y" >> out/.config
          echo "CONFIG_BACKLIGHT_CLASS_DEVICE=y" >> out/.config
          
          # 5. Disable fitur Panic yang terlalu sensitif
          echo "CONFIG_PANIC_ON_RECURSIVE_FAULT=n" >> out/.config
          echo "CONFIG_PANIC_ON_OOPS=n" >> out/.config
          echo "CONFIG_PANIC_TIMEOUT=0" >> out/.config
          
          # 6. Pastikan Enforcing Tetap Aktif (Karena sudah bisa Homescreen)
          echo "CONFIG_SECURITY_SELINUX=y" >> out/.config
          echo "CONFIG_SECURITY_SELINUX_DEVELOP=y" >> out/.config
          
          # Jawab otomatis config baru
          make O=out ARCH=arm64 olddefconfig
          
          # Kompilasi
          make -j$(nproc --all) O=out ARCH=arm64 \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-android- \
              CROSS_COMPILE_ARM32=arm-linux-androideabi- \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              STRIP=llvm-strip \
              LLVM_IAS=0 \
              KCFLAGS="-w" \
              LDFLAGS="--allow-multiple-definition"

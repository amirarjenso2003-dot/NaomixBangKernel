name: Handwarmer Kernel V11 Enforcing Fix
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt install -y curl wget git build-essential zip bc libssl-dev bison flex libelf-dev libgnutls28-dev python3 python3-dev
          mkdir -p $GITHUB_WORKSPACE/work
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Download Toolchains
        run: |
          cd $GITHUB_WORKSPACE/work
          # Menggunakan Clang yang sedikit lebih stabil untuk MT6768
          git clone https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b -b lineage-20.0 clang --depth=1
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 -b lineage-19.1 gcc64 --depth=1
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 -b lineage-19.1 gcc32 --depth=1

      - name: Clone Source
        run: |
          cd $GITHUB_WORKSPACE/work
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} -b ${{ github.ref_name }} android-kernel --depth=1

      - name: Build Kernel
        run: |
          cd $GITHUB_WORKSPACE/work/android-kernel
          export PATH=$GITHUB_WORKSPACE/work/clang/bin:$GITHUB_WORKSPACE/work/gcc64/bin:$GITHUB_WORKSPACE/work/gcc32/bin:$PATH
          
          # Fix stpcpy & strcpy error pada Clang baru
          sed -i 's/^KBUILD_CFLAGS   :=/KBUILD_CFLAGS   := -fno-builtin-stpcpy -fno-builtin-strcpy /' Makefile
          
          make O=out ARCH=arm64 clean
          make O=out ARCH=arm64 mrproper
          make O=out ARCH=arm64 merlin_defconfig
          
          # --- PERBAIKAN TOTAL V11 (ENFORCING MODE) ---
          
          # 1. Identitas Nama (Wajib agar Wi-Fi/BT Vendor tidak bug)
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-NaomixBang+"/g' out/.config
          
          # 2. SELinux: Enforcing tapi tidak Panic (Standard Android)
          echo "CONFIG_SECURITY_SELINUX=y" >> out/.config
          echo "CONFIG_SECURITY_SELINUX_BOOTPARAM=y" >> out/.config
          echo "CONFIG_SECURITY_SELINUX_DEVELOP=y" >> out/.config
          echo "CONFIG_SECURITY_SELINUX_CHECKREQPROT_VALUE=1" >> out/.config
          
          # 3. Fix I2C & Power Management (Masalah smb1351_charger di log)
          echo "CONFIG_I2C_CHARDEV=y" >> out/.config
          echo "CONFIG_I2C_HELPER_DISTRIBUTED=y" >> out/.config
          echo "CONFIG_REGMAP_I2C=y" >> out/.config
          
          # 4. Longgarkan Watchdog (Mencegah reboot di logo MIUI)
          echo "CONFIG_MTK_WD_KICKER=y" >> out/.config
          echo "CONFIG_MTK_WATCHDOG_REBOOT_LEVEL=0" >> out/.config
          echo "CONFIG_PANIC_TIMEOUT=5" >> out/.config
          echo "CONFIG_PANIC_ON_OOPS=n" >> out/.config
          
          # 5. Fix Mounting Partisi (Berdasarkan error 'Device or resource busy')
          echo "CONFIG_FUSE_FS=y" >> out/.config
          echo "CONFIG_OVERLAY_FS=y" >> out/.config
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> out/.config
          
          # 6. Matikan Debugging Berat yang bikin lemot saat boot
          echo "CONFIG_SLUB_DEBUG=n" >> out/.config
          echo "CONFIG_PROVE_LOCKING=n" >> out/.config
          echo "CONFIG_DEBUG_ATOMIC_SLEEP=n" >> out/.config
          
          # Terapkan config
          make O=out ARCH=arm64 olddefconfig
          
          # Mulai Kompilasi
          make -j$(nproc --all) O=out ARCH=arm64 \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-android- \
              CROSS_COMPILE_ARM32=arm-linux-androideabi- \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              STRIP=llvm-strip \
              LLVM_IAS=0 \
              KCFLAGS="-w" \
              LDFLAGS="--allow-multiple-definition"

      - name: Package AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE/work
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          IMAGE=$(find android-kernel/out/arch/arm64/boot -name "Image.gz*" -type f | head -n 1)
          if [ -f "$IMAGE" ]; then
            cp "$IMAGE" AnyKernel3/
            cd AnyKernel3
            # Script instalasi yang lebih aman untuk Merlin/Lancelot
            printf "properties() { '\nkernel.string=Handwarmer V11 Enforcing\ndo.devicecheck=1\ndo.modules=0\ndo.systemless=1\ndo.cleanup=1\ndo.cleanuponabort=0\ndevice.name1=merlin\ndevice.name2=lancelot\n'; }\nblock=/dev/block/by-name/boot;\nis_slot_device=0;\nramdisk_compression=auto;\npatch_vbmeta_flag=auto;\n. tools/ak3-core.sh;\nui_print \"------------------------------\";\nui_print \" Handwarmer Kernel V11 \";\nui_print \" Mode: Enforcing \";\nui_print \" Build: Fixed SMB1351 & WDT \";\nui_print \"------------------------------\";\nsplit_boot;\nflash_boot;\nflash_dtbo;\n" > anykernel.sh
            zip -r9 "../Handwarmer-V11-Enforcing.zip" *
          else
            echo "Build failed, Image.gz not found!"
            exit 1
          fi

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Handwarmer-V11-Enforcing
          path: work/Handwarmer-V11-Enforcing.zip

name: Naomix Auto Compile
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt install -y curl wget git build-essential zip bc libssl-dev bison flex libelf-dev libgnutls28-dev
          mkdir -p $GITHUB_WORKSPACE/work

      - name: Download Toolchains
        run: |
          cd $GITHUB_WORKSPACE/work
          # Clang r416183b & GCC 4.9 (Standar LineageOS/Xiaomi)
          git clone https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b -b lineage-20.0 clang --depth=1
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 -b lineage-19.1 gcc64 --depth=1
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 -b lineage-19.1 gcc32 --depth=1

      - name: Download Source Naomix
        run: |
          cd $GITHUB_WORKSPACE/work
          # GANTI_DI_SINI: Masukkan link repo dan branch Naomix kamu
          git clone https://github.com/username/repo_naomix -b main android-kernel --depth=1

      - name: Build Kernel
        run: |
          cd $GITHUB_WORKSPACE/work/android-kernel
          
          # Setup Path secara otomatis
          export PATH=$GITHUB_WORKSPACE/work/clang/bin:$GITHUB_WORKSPACE/work/gcc64/bin:$GITHUB_WORKSPACE/work/gcc32/bin:$PATH
          
          # GANTI_DI_SINI: Masukkan nama defconfig kamu (contoh: merlin_defconfig)
          export DEFCONFIG=merlin_defconfig
          
          make O=out ARCH=arm64 clean
          make O=out ARCH=arm64 mrproper
          make O=out ARCH=arm64 $DEFCONFIG
          
          make -j$(nproc --all) O=out \
              ARCH=arm64 \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-android- \
              CROSS_COMPILE_ARM32=arm-linux-androideabi- \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              STRIP=llvm-strip \
              HOSTCC=gcc \
              HOSTCXX=g++ \
              LLVM=1 \
              LLVM_IAS=1

      - name: AnyKernel3 ZIP
        run: |
          cd $GITHUB_WORKSPACE/work
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          
          # Mencari file hasil build secara otomatis
          # GANTI_DI_SINI: Ganti Image.gz-dtb jika hasil build kamu namanya berbeda (misal Image.gz)
          if [ -f android-kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp android-kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
            cd AnyKernel3
            zip -r9 "../Naomix-Build-$(date +'%Y%m%d').zip" *
          else
            echo "Build gagal, file tidak ditemukan!"
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Naomix-Result
          path: work/*.zip

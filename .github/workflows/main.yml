name: Build Kernel Handwarmer

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel by amirarjenso
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip

    - name: Download Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

    - name: Download AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3

    - name: Compile Kernel Source
      run: |
        export PATH="$(pwd)/clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export HEADER_ARCH=arm64
        
        make O=out merlin_defconfig
        make -j$(nproc --all) O=out \
                      CC=clang \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: Package with AnyKernel3
      run: |
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null || cp out/arch/arm64/boot/Image AnyKernel3/
        cd AnyKernel3
        sed -i 's/kernel.string=.*/kernel.string=handwarmer by amirarjenso/' anykernel.sh
        zip -r9 ../handwarmer-kernel.zip *
        cd ..

    - name: Upload Handwarmer Kernel Zip
      uses: actions/upload-artifact@v4
      with:
        name: handwarmer-kernel-release
        path: handwarmer-kernel.zip

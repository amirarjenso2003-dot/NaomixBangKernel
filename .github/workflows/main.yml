- name: Build Kernel
        run: |
          cd $GITHUB_WORKSPACE/work/android-kernel
          export PATH=$GITHUB_WORKSPACE/work/clang/bin:$GITHUB_WORKSPACE/work/gcc64/bin:$GITHUB_WORKSPACE/work/gcc32/bin:$PATH
          
          # Bersihkan total
          make O=out ARCH=arm64 clean
          make O=out ARCH=arm64 mrproper
          make O=out ARCH=arm64 merlin_defconfig
          
          # --- FIX WIFI & BLUETOOTH (THE MAGIC TOUCH) ---
          # 1. Pastikan nama kernel tidak terlalu asing bagi driver vendor
          # Kita pakai nama yang agak mirip tapi tetap ada branding kamu
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-Handwarmer-kitsune"/g' out/.config
          
          # 2. Matikan proteksi yang bikin driver Wi-Fi (blob) nolak buat load
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/g' out/.config
          
          # 3. Paksa agar modul Wi-Fi/BT mau load meski vermagic beda sedikit
          echo "CONFIG_MODULE_FORCE_LOAD=y" >> out/.config
          echo "CONFIG_MODVERSIONS=y" >> out/.config
          
          # Jalankan Build
          make -j$(nproc --all) O=out \
              ARCH=arm64 \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-android- \
              CROSS_COMPILE_ARM32=arm-linux-androideabi- \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              STRIP=llvm-strip \
              LLVM_IAS=0 \
              KCFLAGS="-w -fno-stack-protector -fno-builtin-stpcpy -fno-builtin-strcpy" \
              LDFLAGS="--allow-multiple-definition"

      - name: Package AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE/work
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          IMAGE=$(find android-kernel/out/arch/arm64/boot -name "Image.gz*" -type f | head -n 1)
          if [ -f "$IMAGE" ]; then
            cp "$IMAGE" AnyKernel3/
            cd AnyKernel3
            
            # Script installer tetap pakai nama Kitsunednm & Doism
            printf "properties() { '\nkernel.string=Handwarmer V2 (Fix WiFi)\ndo.devicecheck=1\ndo.modules=0\ndo.systemless=1\ndo.cleanup=1\ndo.cleanuponabort=0\ndevice.name1=merlin\ndevice.name2=lancelot\n'; }\n" > anykernel.sh
            printf "block=/dev/block/by-name/boot;\nis_slot_device=0;\nramdisk_compression=auto;\npatch_vbmeta_flag=auto;\n" >> anykernel.sh
            printf ". tools/ak3-core.sh;\n" >> anykernel.sh
            printf "ui_print \"------------------------------\";\n" >> anykernel.sh
            printf "ui_print \" Handwarmer Kernel V2 \";\n" >> anykernel.sh
            printf "ui_print \" WiFi & BT Fix Edition \";\n" >> anykernel.sh
            printf "ui_print \" Source Owner: Doism \";\n" >> anykernel.sh
            printf "ui_print \" Compiled by: kitsunednm \";\n" >> anykernel.sh
            printf "ui_print \"------------------------------\";\n" >> anykernel.sh
            printf "split_boot;\nflash_boot;\nflash_dtbo;\n" >> anykernel.sh
            
            zip -r9 "../Handwarmer-V2-Fix-WiFi.zip" *

name: Naomix Kernel Compiler
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt install -y curl wget git build-essential zip bc libssl-dev bison flex libelf-dev libgnutls28-dev python3 python3-dev
          mkdir -p $GITHUB_WORKSPACE/work
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Download Toolchains
        run: |
          cd $GITHUB_WORKSPACE/work
          # Clang r416183b + GCC 4.9 untuk Merlin
          git clone https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b -b lineage-20.0 clang --depth=1
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 -b lineage-19.1 gcc64 --depth=1
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 -b lineage-19.1 gcc32 --depth=1

      - name: Clone Source
        run: |
          cd $GITHUB_WORKSPACE/work
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} -b ${{ github.ref_name }} android-kernel --depth=1

      - name: Build Kernel
        run: |
          cd $GITHUB_WORKSPACE/work/android-kernel
          export PATH=$GITHUB_WORKSPACE/work/clang/bin:$GITHUB_WORKSPACE/work/gcc64/bin:$GITHUB_WORKSPACE/work/gcc32/bin:$PATH
          
          make O=out ARCH=arm64 clean
          make O=out ARCH=arm64 mrproper
          make O=out ARCH=arm64 merlin_defconfig
          
          # Fix error stpcpy/strcpy dengan mematikan Stack Protector
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/g' out/.config
          sed -i 's/CONFIG_CC_STACKPROTECTOR=y/# CONFIG_CC_STACKPROTECTOR is not set/g' out/.config
          
          # Eksekusi dengan LLD Linker untuk fix relocation error
          make -j$(nproc --all) O=out \
              ARCH=arm64 \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-android- \
              CROSS_COMPILE_ARM32=arm-linux-androideabi- \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              STRIP=llvm-strip \
              LLVM_IAS=0 \
              KCFLAGS="-w -fno-stack-protector -fno-builtin-stpcpy -fno-builtin-strcpy" \
              LDFLAGS="--allow-multiple-definition"

      - name: Package AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE/work
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          
          IMAGE=$(find android-kernel/out/arch/arm64/boot -name "Image.gz*" -type f | head -n 1)
          
          if [ -f "$IMAGE" ]; then
            cp "$IMAGE" AnyKernel3/
            cd AnyKernel3
            
            # --- OVERWRITE ANYKERNEL.SH (CARA NUKLIR) ---
            # Kita buat ulang file anykernel.sh agar jalurnya 100% benar untuk MediaTek
            cat <<EOF > anykernel.sh
            # AnyKernel3 Ramdisk Mod Script
            # osm0sis @ xda-developers

            properties() { '
            kernel.string=Naomix Kernel for Merlin
            do.devicecheck=1
            do.modules=0
            do.systemless=1
            do.cleanup=1
            do.cleanuponabort=0
            device.name1=merlin
            device.name2=lancelot
            device.name3=galahad
            device.name4=
            device.name5=
            supported.versions=
            supported.patchlevels=
            '; }

            # Boot block setup
            # Langsung paksa ke jalur MediaTek by-name
            block=/dev/block/by-name/boot;
            is_slot_device=0;
            ramdisk_compression=auto;
            patch_vbmeta_flag=auto;

            ## AnyKernel methods (do not edit)
            # load shell library
            . tools/ak3-core.sh;

            ## AnyKernel install
            ui_print "------------------------------";
            ui_print " Compiled by: ${{ github.actor }} ";
            ui_print " Built on GitHub Actions ";
            ui_print "------------------------------";
            
            split_boot;
            flash_boot;
            flash_dtbo;
            ## end install
            EOF

            # Bersihkan line ending Windows agar tidak error di TWRP
            sed -i 's/\r$//' anykernel.sh
            
            zip -r9 "../Kernel-Merlin-SuperFix.zip" *
          else
            echo "Build gagal, file Image tidak ditemukan!"
            exit 1
          fi

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Merlin-SuperFix
          path: work/Kernel-Merlin-SuperFix.zip

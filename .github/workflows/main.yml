name: Handwarmer Kernel V16 - Final Stability + KSU
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt install -y curl wget git build-essential zip bc libssl-dev bison flex libelf-dev libgnutls28-dev python3 python3-dev
          mkdir -p $GITHUB_WORKSPACE/work
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Download Toolchains
        run: |
          cd $GITHUB_WORKSPACE/work
          # Menggunakan Clang r416183b (Stabil untuk KSU 1.0.8)
          git clone https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b -b lineage-20.0 clang --depth=1
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 -b lineage-19.1 gcc64 --depth=1
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 -b lineage-19.1 gcc32 --depth=1

      - name: Clone Source & Integrate KernelSU
        run: |
          cd $GITHUB_WORKSPACE/work
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} -b ${{ github.ref_name }} android-kernel --depth=1
          
          # INTEGRASI KERNELSU 1.0.8 (Official Setup)
          cd android-kernel
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: Build Kernel
        run: |
          cd $GITHUB_WORKSPACE/work/android-kernel
          export PATH=$GITHUB_WORKSPACE/work/clang/bin:$GITHUB_WORKSPACE/work/gcc64/bin:$GITHUB_WORKSPACE/work/gcc32/bin:$PATH
          
          # Fix stpcpy & strcpy
          sed -i 's/^KBUILD_CFLAGS   :=/KBUILD_CFLAGS   := -fno-builtin-stpcpy -fno-builtin-strcpy /' Makefile
          
          make O=out ARCH=arm64 clean
          make O=out ARCH=arm64 mrproper
          make O=out ARCH=arm64 merlin_defconfig
          
          # --- PERBAIKAN V16 (MENGIKUTI BLUEPRINT DOISSM) ---
          
          # 1. Identitas Lokal
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-NaomixBang+"/g' out/.config
          
          # 2. Fix Sleep Death (Kunci agar tidak Restart saat Layar Off)
          # Kita matikan MTK_CPUIDLE karena sering menyebabkan 'stuck' pada GCE MediaTek
          echo "CONFIG_MTK_CPUIDLE=n" >> out/.config
          echo "CONFIG_MTK_SMART_LPM=n" >> out/.config
          echo "CONFIG_ARM_CPUIDLE=y" >> out/.config
          
          # 3. Jinakkan Watchdog secara Total (Rahasia doissM)
          # Kita izinkan driver 'telat' tanpa memicu reboot
          echo "CONFIG_MTK_WD_KICKER=y" >> out/.config
          echo "CONFIG_MTK_WATCHDOG_REBOOT_LEVEL=0" >> out/.config
          echo "CONFIG_LOCKUP_DETECTOR=n" >> out/.config
          echo "CONFIG_DETECT_HUNG_TASK=n" >> out/.config
          
          # 4. Aktifkan KernelSU 1.0.8
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KSU_DEBUG=n" >> out/.config
          
          # 5. Fix Display Pipeline (Berdasarkan log Composer error)
          echo "CONFIG_MTK_GCE_SUPPORT=y" >> out/.config
          echo "CONFIG_MTK_FENCE_WAIT=y" >> out/.config
          
          # 6. Panic Control
          echo "CONFIG_PANIC_TIMEOUT=0" >> out/.config
          echo "CONFIG_PANIC_ON_OOPS=n" >> out/.config
          
          make O=out ARCH=arm64 olddefconfig
          
          # Kompilasi
          make -j$(nproc --all) O=out ARCH=arm64 \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-android- \
              CROSS_COMPILE_ARM32=arm-linux-androideabi- \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              STRIP=llvm-strip \
              LLVM_IAS=0 \
              KCFLAGS="-w" \
              LDFLAGS="--allow-multiple-definition"

      - name: Package AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE/work
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          IMAGE=$(find android-kernel/out/arch/arm64/boot -name "Image.gz*" -type f | head -n 1)
          if [ -f "$IMAGE" ]; then
            cp "$IMAGE" AnyKernel3/
            cd AnyKernel3
            # Script AnyKernel3 dengan Mode Enforcing
            printf "properties() { '\nkernel.string=Handwarmer V16-KSU\ndo.devicecheck=1\ndo.modules=0\ndo.systemless=1\ndo.cleanup=1\ndo.cleanuponabort=0\ndevice.name1=merlin\ndevice.name2=lancelot\n'; }\nblock=/dev/block/by-name/boot;\nis_slot_device=0;\nramdisk_compression=auto;\npatch_vbmeta_flag=auto;\n. tools/ak3-core.sh;\nui_print \"------------------------------\";\nui_print \" Handwarmer Kernel V16 \";\nui_print \" Stability & KSU 1.0.8 \";\nui_print \"------------------------------\";\nsplit_boot;\nflash_boot;\nflash_dtbo;\n" > anykernel.sh
            zip -r9 "../Handwarmer-V16-Final.zip" *
          else
            exit 1
          fi

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Handwarmer-V16-Final
          path: work/Handwarmer-V16-Final.zip
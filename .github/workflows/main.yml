name: Handwarmer Kernel V13 DeepSleep Fix
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt install -y curl wget git build-essential zip bc libssl-dev bison flex libelf-dev libgnutls28-dev python3 python3-dev
          mkdir -p $GITHUB_WORKSPACE/work
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Download Toolchains
        run: |
          cd $GITHUB_WORKSPACE/work
          git clone https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b -b lineage-20.0 clang --depth=1
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 -b lineage-19.1 gcc64 --depth=1
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 -b lineage-19.1 gcc32 --depth=1

      - name: Clone Source
        run: |
          cd $GITHUB_WORKSPACE/work
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} -b ${{ github.ref_name }} android-kernel --depth=1

      - name: Build Kernel
        run: |
          cd $GITHUB_WORKSPACE/work/android-kernel
          export PATH=$GITHUB_WORKSPACE/work/clang/bin:$GITHUB_WORKSPACE/work/gcc64/bin:$GITHUB_WORKSPACE/work/gcc32/bin:$PATH
          
          # Fix stpcpy error
          sed -i 's/^KBUILD_CFLAGS   :=/KBUILD_CFLAGS   := -fno-builtin-stpcpy -fno-builtin-strcpy /' Makefile
          
          make O=out ARCH=arm64 clean
          make O=out ARCH=arm64 mrproper
          make O=out ARCH=arm64 merlin_defconfig
          
          # --- PERBAIKAN V13 (BRIDGE TO DEEP SLEEP) ---
          
          # 1. Identitas Nama
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-NaomixBang+"/g' out/.config
          
          # 2. Power Management & Sleep Fix
          echo "CONFIG_SUSPEND=y" >> out/.config
          echo "CONFIG_PM_AUTOSLEEP=y" >> out/.config
          echo "CONFIG_PM_WAKELOCKS=y" >> out/.config
          echo "CONFIG_PM_DEBUG=y" >> out/.config
          
          # 3. CPU Idle & Hotplug (Penting agar Core tidak panic saat layar mati)
          echo "CONFIG_CPU_IDLE=y" >> out/.config
          echo "CONFIG_ARM_CPUIDLE=y" >> out/.config
          echo "CONFIG_CPU_IDLE_GOV_MENU=y" >> out/.config
          echo "CONFIG_HOTPLUG_CPU=y" >> out/.config
          
          # 4. Longgarkan Watchdog (Delay 1 detik agar driver sempat 'tidur')
          echo "CONFIG_MTK_WD_KICKER=y" >> out/.config
          echo "CONFIG_MTK_WATCHDOG_REBOOT_LEVEL=0" >> out/.config
          echo "CONFIG_LOCKUP_DETECTOR=n" >> out/.config
          
          # 5. Fix Display Writeback (Sering jadi penyebab hang saat layar off)
          echo "CONFIG_FB_MSM_MDSS_WRITEBACK=y" >> out/.config
          
          # 6. Panic & Security
          echo "CONFIG_PANIC_TIMEOUT=0" >> out/.config
          echo "CONFIG_PANIC_ON_OOPS=n" >> out/.config
          echo "CONFIG_SECURITY_SELINUX=y" >> out/.config
          echo "CONFIG_SECURITY_SELINUX_DEVELOP=y" >> out/.config
          
          make O=out ARCH=arm64 olddefconfig
          
          # Kompilasi
          make -j$(nproc --all) O=out ARCH=arm64 \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-android- \
              CROSS_COMPILE_ARM32=arm-linux-androideabi- \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              STRIP=llvm-strip \
              LLVM_IAS=0 \
              KCFLAGS="-w" \
              LDFLAGS="--allow-multiple-definition"

      - name: Package AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE/work
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          IMAGE=$(find android-kernel/out/arch/arm64/boot -name "Image.gz*" -type f | head -n 1)
          if [ -f "$IMAGE" ]; then
            cp "$IMAGE" AnyKernel3/
            cd AnyKernel3
            printf "properties() { '\nkernel.string=Handwarmer V13 StableSleep\ndo.devicecheck=1\ndo.modules=0\ndo.systemless=1\ndo.cleanup=1\ndo.cleanuponabort=0\ndevice.name1=merlin\ndevice.name2=lancelot\n'; }\nblock=/dev/block/by-name/boot;\nis_slot_device=0;\nramdisk_compression=auto;\npatch_vbmeta_flag=auto;\n. tools/ak3-core.sh;\nui_print \"------------------------------\";\nui_print \" Handwarmer Kernel V13 \";\nui_print \" Target: Sleep Stability \";\nui_print \"------------------------------\";\nsplit_boot;\nflash_boot;\nflash_dtbo;\n" > anykernel.sh
            zip -r9 "../Handwarmer-V13-Final.zip" *
          else
            exit 1
          fi

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Handwarmer-V13-Final
          path: work/Handwarmer-V13-Final.zip

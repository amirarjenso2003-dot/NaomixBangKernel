name: Naomix Kernel Compiler
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt install -y curl wget git build-essential zip bc libssl-dev bison flex libelf-dev libgnutls28-dev python3 python3-dev
          mkdir -p $GITHUB_WORKSPACE/work
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Download Toolchains
        run: |
          cd $GITHUB_WORKSPACE/work
          git clone https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b -b lineage-20.0 clang --depth=1
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 -b lineage-19.1 gcc64 --depth=1
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 -b lineage-19.1 gcc32 --depth=1

      - name: Clone Source
        run: |
          cd $GITHUB_WORKSPACE/work
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} -b ${{ github.ref_name }} android-kernel --depth=1

      - name: Build Kernel
        run: |
          cd $GITHUB_WORKSPACE/work/android-kernel
          export PATH=$GITHUB_WORKSPACE/work/clang/bin:$GITHUB_WORKSPACE/work/gcc64/bin:$GITHUB_WORKSPACE/work/gcc32/bin:$PATH
          make O=out ARCH=arm64 clean
          make O=out ARCH=arm64 mrproper
          make O=out ARCH=arm64 merlin_defconfig
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/g' out/.config
          sed -i 's/CONFIG_CC_STACKPROTECTOR=y/# CONFIG_CC_STACKPROTECTOR is not set/g' out/.config
          make -j$(nproc --all) O=out \
              ARCH=arm64 \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-android- \
              CROSS_COMPILE_ARM32=arm-linux-androideabi- \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              STRIP=llvm-strip \
              LLVM_IAS=0 \
              KCFLAGS="-w -fno-stack-protector -fno-builtin-stpcpy -fno-builtin-strcpy" \
              LDFLAGS="--allow-multiple-definition"

      - name: Package AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE/work
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          IMAGE=$(find android-kernel/out/arch/arm64/boot -name "Image.gz*" -type f | head -n 1)
          if [ -f "$IMAGE" ]; then
            cp "$IMAGE" AnyKernel3/
            cd AnyKernel3
            
            # Buat file anykernel.sh pakai echo biar gak ngerusak indentasi YAML
            echo "properties() { '" > anykernel.sh
            echo "kernel.string=Naomix Kernel for Merlin" >> anykernel.sh
            echo "do.devicecheck=1" >> anykernel.sh
            echo "do.modules=0" >> anykernel.sh
            echo "do.systemless=1" >> anykernel.sh
            echo "do.cleanup=1" >> anykernel.sh
            echo "device.name1=merlin" >> anykernel.sh
            echo "device.name2=lancelot" >> anykernel.sh
            echo "'; }" >> anykernel.sh
            echo "block=/dev/block/by-name/boot;" >> anykernel.sh
            echo "is_slot_device=0;" >> anykernel.sh
            echo "ramdisk_compression=auto;" >> anykernel.sh
            echo "patch_vbmeta_flag=auto;" >> anykernel.sh
            echo ". tools/ak3-core.sh;" >> anykernel.sh
            echo "ui_print \"------------------------------\";" >> anykernel.sh
            echo "ui_print \" Compiled by: ${{ github.actor }} \";" >> anykernel.sh
            echo "ui_print \" Built on GitHub Actions \";" >> anykernel.sh
            echo "ui_print \"------------------------------\";" >> anykernel.sh
            echo "split_boot;" >> anykernel.sh
            echo "flash_boot;" >> anykernel.sh
            echo "flash_dtbo;" >> anykernel.sh
            
            zip -r9 "../Kernel-Merlin-Fixed.zip" *
          else
            echo "Image not found!"
            exit 1
          fi

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Merlin-Fixed
          path: work/Kernel-Merlin-Fixed.zip